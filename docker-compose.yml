services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barcelona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barcelona123}
      POSTGRES_DB: ${POSTGRES_DB:-barcelonacove}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barcelona} -d ${POSTGRES_DB:-barcelonacove}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-barcelona}:${POSTGRES_PASSWORD:-barcelona123}@db:5432/${POSTGRES_DB:-barcelonacove}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      MAYAR_API_KEY: ${MAYAR_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      # Opsional: untuk upload file via Netlify Blobs. Kosongkan jika tidak dipakai
      # (perhatikan: tanpa ini upload bukti pembayaran mungkin butuh penyesuaian).
      NETLIFY_SITE_ID: ${NETLIFY_SITE_ID:-}
      NETLIFY_BLOBS_TOKEN: ${NETLIFY_BLOBS_TOKEN:-}
    volumes:
      - uploads:/app/public/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
